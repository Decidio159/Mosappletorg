<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Ваше фото до работы — тот же ракурс, что и «после»">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#3c4453"/><stop offset="1" stop-color="#20242c"/></linearGradient></defs>
<rect width="1200" height="750" fill="url(#g)"/>
<g font-family="Inter, system-ui, sans-serif" text-anchor="middle" fill="#ffffff">
<text x="50%" y="340" font-size="64" font-weight="700" letter-spacing="2" opacity="0.9">ВАШЕ ФОТО</text>
<text x="50%" y="417" font-size="64" font-weight="700" letter-spacing="2" opacity="0.9">ДО РАБОТЫ</text>
<text x="50%" y="471" font-size="26" font-weight="500" letter-spacing="3" opacity="0.55">тот же ракурс, что и «после»</text>
</g>
</svg>
